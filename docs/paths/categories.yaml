get:
  summary: Get all categories
  tags:
    - Categories
  security:
    - bearerAuth: []
  responses:
    '200':
      description: List of categories
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../components/schemas/Category.yaml
    '401':
      description: Missing or invalid token
      content:
        application/json:
          schema:
            $ref: ../components/schemas/UnauthorizedError.yaml
post:
  summary: Create a new category (admin only)
  tags:
    - Categories
  security:
    - bearerAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/CategoryCreateRequest.yaml
  responses:
    '201':
      description: Category created
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Category.yaml
    '400':
      description: Validation error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ValidationError.yaml
    '401':
      description: Missing or invalid token
      content:
        application/json:
          schema:
            $ref: ../components/schemas/UnauthorizedError.yaml
    '403':
      description: Forbidden (non-admin)
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ForbiddenError.yaml
