get:
  summary: Get lists visible to the current user
  tags:
    - Lists
  security:
    - bearerAuth: []
  responses:
    '200':
      description: List of lists
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../components/schemas/List.yaml
    '401':
      description: Missing or invalid token
      content:
        application/json:
          schema:
            $ref: ../components/schemas/UnauthorizedError.yaml
post:
  summary: Create a new list for the current user
  tags:
    - Lists
  security:
    - bearerAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/ListCreateRequest.yaml
  responses:
    '201':
      description: List created
      content:
        application/json:
          schema:
            $ref: ../components/schemas/List.yaml
    '400':
      description: Validation error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ValidationError.yaml
    '401':
      description: Missing or invalid token
      content:
        application/json:
          schema:
            $ref: ../components/schemas/UnauthorizedError.yaml
