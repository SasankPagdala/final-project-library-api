get:
  summary: Get all lists shared with the current user
  tags: [List Sharing]
  security:
    - bearerAuth: []
  responses:
    '200':
      description: Lists shared with user
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              properties:
                id:
                  type: integer
                listId:
                  type: integer
                permissionLevel:
                  type: string
                  enum: [VIEW, EDIT]
                list:
                  $ref: ../components/schemas/List.yaml
    '401':
      description: Missing or invalid token
      content:
        application/json:
          schema:
            $ref: ../components/schemas/UnauthorizedError.yaml
