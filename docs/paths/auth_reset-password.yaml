post:
  summary: Reset password (owner only, using username and email)
  description: >
    Allows a user to reset their own password by providing matching username
    and email. No authentication is required, but both username and email must match an existing user.
  tags:
    - Auth
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            username:
              type: string
              example: johndoe
            email:
              type: string
              format: email
              example: john@example.com
            newPassword:
              type: string
              format: password
              example: ResetUserPass789!
          required:
            - username
            - email
            - newPassword
  responses:
    '200':
      description: Password has been reset successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Password has been reset successfully
    '400':
      description: Missing fields or validation error
    '404':
      description: User not found