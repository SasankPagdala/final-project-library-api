get:
  summary: Get all items
  tags:
    - Items
  security:
    - bearerAuth: []
  responses:
    '200':
      description: List of items
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../components/schemas/Item.yaml
    '401':
      description: Missing or invalid token
      content:
        application/json:
          schema:
            $ref: ../components/schemas/UnauthorizedError.yaml
post:
  summary: Create a new item (admin only)
  tags:
    - Items
  security:
    - bearerAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/ItemCreateRequest.yaml
  responses:
    '201':
      description: Item created
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Item.yaml
    '400':
      description: Validation error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ValidationError.yaml
    '401':
      description: Missing or invalid token
      content:
        application/json:
          schema:
            $ref: ../components/schemas/UnauthorizedError.yaml
    '403':
      description: Forbidden (non-admin)
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ForbiddenError.yaml
