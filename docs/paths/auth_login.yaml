post:
  summary: Log in and obtain a JWT
  tags:
    - Auth
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/AuthLoginRequest.yaml
  responses:
    '200':
      description: Login successful
      content:
        application/json:
          schema:
            $ref: ../components/schemas/AuthLoginResponse.yaml
    '400':
      description: Validation error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ValidationError.yaml
    '401':
      description: Invalid email or password
      content:
        application/json:
          schema:
            $ref: ../components/schemas/UnauthorizedError.yaml
