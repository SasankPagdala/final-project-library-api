put:
  summary: Admin reset user password
  description: >
    Allows an admin to reset a user's password by user ID.
  tags:
    - Users
  security:
    - bearerAuth: []
  parameters:
    - name: id
      in: path
      required: true
      description: ID of the user whose password will be reset
      schema:
        type: integer
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            newPassword:
              type: string
              format: password
              example: AdminReset999!
          required:
            - newPassword
  responses:
    '200':
      description: Password has been reset successfully by admin
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Password for user 5 has been reset by admin.
    '400':
      description: Missing or invalid data
    '401':
      description: Missing or invalid JWT
    '403':
      description: Forbidden – only admins can reset other users' passwords
    '404':
      description: User not found