post:
  summary: Change password (authenticated user)
  description: >
    Allows the currently authenticated user to change their password by providing
    the current password and a new password.
  tags:
    - Auth
  security:
    - bearerAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            currentPassword:
              type: string
              format: password
              example: UserPass123!
            newPassword:
              type: string
              format: password
              example: NewUserPass456!
          required:
            - currentPassword
            - newPassword
  responses:
    '200':
      description: Password updated successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Password updated successfully
    '400':
      description: Missing fields or invalid current password
    '401':
      description: Missing or invalid JWT